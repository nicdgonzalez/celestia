[package]
name = "celestia"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nicdgonzalez/celestia"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.5", features = ["derive"] }
colored = "3.1.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt"] }
